name: Verify and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; always finish the newest one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Parses every shipped module, validates the sprite data against what the
      # renderer asks for by name, checks the balance invariants, and confirms
      # all ten maps can seat both guns on solid ground.
      - name: Pre-deploy checks
        run: node tools/verify.mjs

      # A short balance run. Slow enough to keep out of the fast path on PRs,
      # fast enough to catch a tuning change that breaks match pacing.
      - name: Balance smoke test
        run: node tools/playtest.mjs --matches 40 --map flanders

  deploy:
    name: Deploy to GitHub Pages
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
